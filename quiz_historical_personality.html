const archetypes=[

{name:"王阳明",type:"文人",quote:"答案不只在远处，也在你愿意践行的那一步。",traits:["自省","原则","实践"],desc:"你喜欢让想法与行动一致。遇到问题，你会思考背后的意义，也在意自己是否真正做到相信的事情。",reason:"你的选择显示出价值判断、独立思考与实践倾向。你并不满足于只谈道理，愿意把理念放进生活。",adv:"隐藏优势是自我校准：在变化中仍能找到内在标准，避免被外界节奏完全牵引。",easter:"彩蛋：你可能是那种写下感悟之后，真的会试着改掉一个小习惯的人。"},
{name:"李白",type:"诗人",quote:"不把世界走窄，灵感便有地方落脚。",traits:["想象力","好奇","自由"],desc:"你容易被新鲜事物吸引，喜欢保留探索的空间。对你而言，生活不只是任务列表，也是一连串值得体验的故事。",reason:"你的选择偏向兴趣驱动、开放体验和表达。你愿意在熟悉的轨道之外寻找新的可能。",adv:"隐藏优势是连接看似无关的事物，产生新点子，并用独特视角看待日常。",easter:"彩蛋：你的待办清单里可能混着“必须完成”和“突然想去看看海”。"},
